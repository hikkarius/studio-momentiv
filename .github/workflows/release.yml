name: Release for friends

# Raise "version" in version.json and push to main: this builds Studio-Momentiv.zip and publishes
# GitHub Release v<version> with it. The studio's «Оновити» button downloads that file.
# Nothing happens if a release for that version already exists.
on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          v=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build Studio-Momentiv.zip
        if: steps.v.outputs.exists == 'false'
        run: |
          mkdir -p dist/Studio-Momentiv
          git ls-files -z | grep -zvE '^(tests/|\.github/|\.agents/|\.antigravity/|\.claude/|scripts/|CLAUDE\.md$|review_agent\.py$|pytest\.ini$|\.coveragerc$|\.dockerignore$|requirements-dev\.txt$)' \
            | xargs -0 -I{} cp --parents {} dist/Studio-Momentiv/
          cd dist && python3 -c "import shutil; shutil.make_archive('Studio-Momentiv', 'zip', '.', 'Studio-Momentiv')"

      - name: Publish the release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Студія моментів ${{ steps.v.outputs.tag }}
          files: dist/Studio-Momentiv.zip
          generate_release_notes: true
