# ─────────────────────────────────────────────────────────────────────────────
# config.yaml — Налаштування AI Video Moments Analyzer Studio
# Редагуй цей файл, щоб змінити поведінку без правки коду.
# ─────────────────────────────────────────────────────────────────────────────

whisper:
  model: large-v3-turbo # tiny | base | small | medium | large-v3 | large-v3-turbo (найкраща для української, ~2.3 ГБ відеопам'яті)
  language: uk          # uk (українська) | auto (автовизначення) | en
  device: auto          # auto (вибере GPU якщо є) | cpu | cuda
  compute_type: int8    # int8 (cpu) | float16 (cuda) | float32
  cpu_threads: 8        # потоки CPU (ігнорується якщо device=cuda)
  faster_whisper: true  # швидка CTranslate2 транскрипція з прозорим fallback
  beam_size: 5          # розмір променя пошуку для точності розпізнавання
  batch_size: 8         # на відеокарті: скільки 30-секундних шматків розпізнавати разом (0 = по одному, як раніше)
  idle_unload_min: 10   # вивантажити модель з відеопам'яті після N хвилин без роботи (0 = ніколи)

clips:
  interval_sec: 28      # 1 кліп на кожні N секунд (авто-розрахунок)
  default_min_len: 15   # мін. тривалість кліпу (сек)
  default_max_len: 60   # макс. тривалість кліпу (сек)
  max_count: 100        # верхня межа кількості кліпів
  max_overlap_sec: 2    # скільки секунд можуть мати спільного два кліпи (0 = зовсім без перетинів)

gemini:
  candidate_models:
    # Оптимальні, перевірені та блискавичні моделі згідно актуального API Google
    # Розташовані від найшвидшої та найстабільнішої до запасних
    - gemini-3.1-flash-lite   # Ультрашвидка (0.7-1.2с, максимальна стабільність) — головний вибір
    - gemini-3.5-flash-lite   # Дуже швидка (~0.8-1.5с, висока точність та інтелект)
    # gemini-3.5-flash навмисно не в списку: на безкоштовному ключі їй дають лише 5 запитів
    # за хвилину і 20 за день, тож як запасна вона швидко вичерпується і дає лише 429.
    # З платним ключем її можна дописати сюди третьою.
  fallback_models:           # запасна: її питаємо один раз, лише коли всі моделі вище кажуть «перевантажено» (503)
    - gemini-3.6-flash
  rerank: true               # другий прохід: Gemini порівнює всі кліпи між собою і уточнює оцінки
  parallel_windows: 3        # довге відео: скільки частин транскрипції аналізувати одночасно
  max_rpm_per_model: 12      # не більше N запитів до однієї моделі за хвилину (безкоштовний ключ дає 15; 0 = без обмеження)
  thinking_level: minimal    # скільки моделі «думати» перед відповіддю: minimal (найшвидше) | low | medium | high | "" (як задумано в моделі)


cache:
  enabled: true
  dir: .transcript_cache    # директорія для кешу транскрипцій

logging:
  level: INFO              # DEBUG | INFO | WARNING | ERROR | CRITICAL
  format: text             # text (читабельний для розробки) | json (структурований для prod)
  file: shorts_automator.log

